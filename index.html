<!DOCTYPE html>
<html lang="ja">

<head>
  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0, viewport-fit=cover"
  >

  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">

  <title>QRコード読み取り</title>

  <!-- html5-qrcode -->
  <script src="https://unpkg.com/html5-qrcode"></script>

  <style>

    * {
      box-sizing: border-box;
    }

    html,
    body {
      margin: 0;
      padding: 0;
      width: 100%;
      min-height: 100%;
    }

    body {
      font-family:
        -apple-system,
        BlinkMacSystemFont,
        "Helvetica Neue",
        Arial,
        sans-serif;

      background: #ffffff;
      color: #222222;

      padding:
        20px
        16px
        calc(20px + env(safe-area-inset-bottom));
    }


    /* ------------------------------
       タイトル
       ------------------------------ */

    h2 {
      margin: 10px 0 20px;
      text-align: center;
      font-size: 24px;
      font-weight: 600;
    }


    /* ------------------------------
       QR Reader
       ------------------------------ */

    #reader {
      width: min(500px, 100%);
      margin: 0 auto;
    }


    /*
     * html5-qrcodeが作るvideoを
     * スマホ画面に合わせる
     */

    #reader video {
      width: 100% !important;
      height: auto !important;
      border-radius: 12px;
    }


    /* ------------------------------
       ボタン
       ------------------------------ */

    .button-area {
      text-align: center;
      margin-top: 15px;
    }

    button {
      appearance: none;
      -webkit-appearance: none;

      border: 1px solid #999999;
      border-radius: 8px;

      background: #ffffff;

      padding: 12px 20px;

      font-size: 16px;

      cursor: pointer;

      touch-action: manipulation;
    }

    button:active {
      background: #eeeeee;
    }


    /* ------------------------------
       結果
       ------------------------------ */

    #result {
      width: min(500px, 100%);
      margin: 20px auto 0;

      font-size: 17px;
      line-height: 1.6;

      word-break: break-word;
    }

    .result-item {
      padding: 8px 0;
      border-bottom: 1px solid #eeeeee;
    }

    .success {
      color: #16803c;
    }

    .error {
      color: #c62828;
    }

    .info {
      color: #555555;
    }

    .reading {
      font-weight: bold;
    }


    /* ------------------------------
       保存中表示
       ------------------------------ */

    #saving {
      display: none;

      width: min(500px, 100%);
      margin: 15px auto 0;

      text-align: center;

      font-size: 16px;
      color: #555555;
    }


    /* ------------------------------
       カメラエラー
       ------------------------------ */

    #camera-error {
      display: none;

      width: min(500px, 100%);
      margin: 20px auto;

      padding: 15px;

      border-radius: 8px;

      background: #fff3f3;

      color: #c62828;

      line-height: 1.6;
    }

  </style>

</head>


<body>

  <h2>どのおかずを食べるかな？</h2>


  <!-- カメラ -->
  <div id="reader"></div>


  <!-- カメラエラー -->
  <div id="camera-error"></div>


  <!-- 保存中 -->
  <div id="saving">
    保存中...
  </div>


  <!-- iPhone / iPad用の音声開始ボタン -->
  <div class="button-area">

    <button id="sound">
      🔊 Sound ON (iPhone / iPad)
    </button>

  </div>


  <!-- 結果 -->
  <div id="result"></div>



  <script>


    // =========================================================
    // ★★★ ここだけ変更してください ★★★
    //
    // GAS WebアプリのURL
    // =========================================================

    const GAS_URL =
      'https://script.google.com/a/macros/gs.seito-fku.ed.jp/s/AKfycbwVX6sD31NkOy5LVPLBEt4tblLdSfDt56gKiCMDRrGZKDKz9TDrn336JjiZ-H2V0N2o/exec';


    // =========================================================
    // 二重読み取り防止
    // =========================================================

    let CURRENT_TEXT = '';


    // =========================================================
    // 保存中フラグ
    // =========================================================

    let IS_SAVING = false;


    // =========================================================
    // 結果表示
    // =========================================================

    function appendResult(text, className = '') {

      const div =
        document.createElement('div');

      div.className =
        'result-item ' + className;

      div.textContent = text;

      document
        .querySelector('#result')
        .appendChild(div);

    }


    // =========================================================
    // 保存中表示
    // =========================================================

    function showSaving() {

      document
        .querySelector('#saving')
        .style.display = 'block';

    }


    function hideSaving() {

      document
        .querySelector('#saving')
        .style.display = 'none';

    }


    // =========================================================
    // GASへデータをPOST
    //
    // fetchではなくHTML form + iframeを使用。
    //
    // iPhone / iPadのSafariでも、GASのCORSレスポンスを
    // JavaScriptで直接読み取る必要がない構成。
    // =========================================================

    function sendToGas(decodedText) {

      return new Promise((resolve, reject) => {

        try {

          // -----------------------------------------------
          // iframeを作成
          // -----------------------------------------------

          const iframe =
            document.createElement('iframe');

          const iframeName =
            'gas_submit_' +
            Date.now() +
            '_' +
            Math.random()
              .toString(36)
              .substring(2);


          iframe.name =
            iframeName;

          iframe.style.display =
            'none';

          document.body.appendChild(iframe);


          // -----------------------------------------------
          // formを作成
          // -----------------------------------------------

          const form =
            document.createElement('form');

          form.method =
            'POST';

          form.action =
            GAS_URL;

          form.target =
            iframeName;

          form.style.display =
            'none';


          // -----------------------------------------------
          // QRコードの内容
          // -----------------------------------------------

          const input =
            document.createElement('input');

          input.type =
            'hidden';

          input.name =
            'text';

          input.value =
            decodedText;


          form.appendChild(input);

          document.body.appendChild(form);


          // -----------------------------------------------
          // 送信
          // -----------------------------------------------

          form.submit();


          // -----------------------------------------------
          // 後始末
          //
          // GASへのPOST処理が完了する時間を少し待つ
          // -----------------------------------------------

          setTimeout(() => {

            try {
              form.remove();
            } catch (e) {
            }

            try {
              iframe.remove();
            } catch (e) {
            }


            resolve({
              success: true
            });

          }, 1500);


        } catch (error) {

          reject(error);

        }

      });

    }


    // =========================================================
    // QRコード読み取り成功
    // =========================================================

    async function onScanSuccess(
      decodedText,
      decodedResult
    ) {

      console.log(
        'onScanSuccess:',
        decodedText
      );


      // -----------------------------------------------
      // 保存中なら新しい読み取りを無視
      // -----------------------------------------------

      if (IS_SAVING) {
        return;
      }


      // -----------------------------------------------
      // 同じQRコードの連続読み取りを防止
      // -----------------------------------------------

      if (CURRENT_TEXT === decodedText) {
        return;
      }


      CURRENT_TEXT =
        decodedText;

      IS_SAVING =
        true;


      // -----------------------------------------------
      // 読み取った内容を表示
      // -----------------------------------------------

      appendResult(
        '読み取り：' + decodedText,
        'reading'
      );


      // -----------------------------------------------
      // 音
      // -----------------------------------------------

      beep();


      // -----------------------------------------------
      // 保存
      // -----------------------------------------------

      showSaving();


      try {

        await sendToGas(decodedText);


        hideSaving();


        appendResult(
          '✓ 保存処理を送信しました。',
          'success'
        );


      } catch (error) {

        console.error(
          'GAS communication error:',
          error
        );


        hideSaving();


        appendResult(
          '✕ 保存に失敗しました：' +
          error.message,
          'error'
        );


        // 保存に失敗したので
        // 同じQRをもう一度読めるようにする
        CURRENT_TEXT = '';

      }


      // -----------------------------------------------
      // 少し待ってから次のQRを読めるようにする
      // -----------------------------------------------

      setTimeout(() => {

        IS_SAVING =
          false;

      }, 1000);

    }



    // =========================================================
    // QRコード読み取りエラー
    //
    // QRがまだ認識できない場合に大量表示されるため、
    // ここでは何もしません。
    // =========================================================

    function onScanFailure(error) {

      // 何もしない

    }



    // =========================================================
    // カメラエラー
    // =========================================================

    function showCameraError(error) {

      const area =
        document.querySelector(
          '#camera-error'
        );

      area.style.display =
        'block';


      let message =
        'カメラを起動できませんでした。';


      if (
        error &&
        error.name === 'NotAllowedError'
      ) {

        message =
          'カメラの使用が許可されていません。' +
          '<br><br>' +
          'ブラウザの設定で、このWebサイトのカメラ使用を許可してください。';

      } else if (
        error &&
        error.name === 'NotFoundError'
      ) {

        message =
          'カメラが見つかりませんでした。';

      } else if (
        error &&
        error.name === 'NotReadableError'
      ) {

        message =
          'カメラを使用できませんでした。' +
          '<br>' +
          '他のアプリがカメラを使用していないか確認してください。';

      }


      area.innerHTML =
        message;

    }



    // =========================================================
    // html5-qrcode開始
    // =========================================================

    function startScanner() {

      try {

        const scanner =
          new Html5QrcodeScanner(
            'reader',
            {
              fps: 10,

              qrbox: {
                width: 250,
                height: 250
              },

              rememberLastUsedCamera: true,

              showTorchButtonIfSupported: true,

              showZoomSliderIfSupported: true
            },

            false
          );


        scanner.render(
          onScanSuccess,
          onScanFailure
        );


      } catch (error) {

        console.error(
          'Scanner error:',
          error
        );

        showCameraError(error);

      }

    }



    // =========================================================
    // 音声
    //
    // 元のindex.htmlに入っていた音声データを使用。
    // =========================================================

    const AUDIO =
      new Audio();

    AUDIO.autoplay =
      true;


    function beep() {

      try {
        AUDIO.src =
          DATA_URL;
      } catch (error) {
        console.log(
          'Audio error:',
          error
        );
      }

    }


    // =========================================================
    // iPhone / iPadで音声許可を取得
    // =========================================================

    document
      .querySelector('#sound')
      .addEventListener(
        'click',
        function() {

          beep();

          this.textContent =
            '🔊 Sound ON';

        }
      );


    // =========================================================
    // ページ読み込み完了
    // =========================================================

    window.addEventListener(
      'load',
      function() {

        startScanner();

      }
    );


  </script>

</body>

</html>
