<!DOCTYPE html>
<html lang="ja">

<head>
  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <title>QRコード読み取り</title>

  <style>

    body {
      font-family: sans-serif;
      margin: 20px;
      text-align: center;
    }

    #reader {
      width: min(500px, 100%);
      margin: 20px auto;
    }

    #result {
      margin-top: 20px;
      text-align: left;
      font-size: 18px;
    }

    .success {
      color: green;
    }

    .error {
      color: red;
    }

    button {
      font-size: 18px;
      padding: 10px 20px;
      margin: 10px;
    }

  </style>

</head>

<body>

  <h2>どのおかずを食べるかな？</h2>

  <div id="reader"></div>

  <button id="sound">
    Sound ON (iOS)
  </button>

  <div id="result"></div>


  <!-- html5-qrcode -->
  <script src="https://unpkg.com/html5-qrcode"></script>


  <script>

    // ========================================
    // ここにGAS WebアプリのURLを入れる 更新
    // ========================================

    const GAS_URL =
      'https://script.google.com/a/macros/gs.seito-fku.ed.jp/s/AKfycbwVX6sD31NkOy5LVPLBEt4tblLdSfDt56gKiCMDRrGZKDKz9TDrn336JjiZ-H2V0N2o/exec';
//https://script.google.com/a/macros/gs.seito-fku.ed.jp/s/AKfycbzoIY0RW0iosZFEoJyXsyl1cCieHnumK7Foxc8vCvdhP969ZhrlolsBMvr4ayMbXkzC/exec

    // ========================================
    // 二重読み取り防止
    // ========================================

    let CURRENT_TEXT = '';


    // ========================================
    // 結果表示
    // ========================================

    function append(text, className = '') {

      const div = document.createElement('div');

      if (className) {
        div.className = className;
      }

      div.textContent = text;

      document.querySelector('#result').appendChild(div);
    }


    // ========================================
    // GASへQRコードを送信
    // JSONPを使用するのでCORS問題を回避
    // ========================================

function sendToGas(decodedText) {

  return new Promise((resolve, reject) => {

    try {

      // GASへ送信するフォーム
      const form = document.createElement('form');

      form.method = 'POST';
      form.action = GAS_URL;

      // 別のiframeへ送信
      const iframeName =
        'gas_submit_' + Date.now();

      const iframe =
        document.createElement('iframe');

      iframe.name = iframeName;
      iframe.style.display = 'none';

      document.body.appendChild(iframe);

      form.target = iframeName;


      // QRコード
      const input =
        document.createElement('input');

      input.type = 'hidden';
      input.name = 'text';
      input.value = decodedText;

      form.appendChild(input);


      // フォームを送信
      document.body.appendChild(form);

      form.submit();


      // GAS側の処理が完了するまで少し待つ
      //
      // クロスオリジンのため、iPad側から
      // GASのレスポンス内容を直接読むことはしません。
      //
      // 送信自体が正常に開始されたら成功とします。

      setTimeout(() => {

        form.remove();

        iframe.remove();

        resolve({
          success: true
        });

      }, 1500);


    } catch (error) {

      reject(error);

    }

  });

}


    // ========================================
    // QRコード読み取り成功
    // ========================================

    async function onScanSuccess(decodedText, decodedResult) {

      console.log(
        'onScanSuccess:',
        decodedText
      );


      // 同じQRコードの連続読み取りを防止
      if (CURRENT_TEXT === decodedText) {
        return;
      }

      CURRENT_TEXT = decodedText;


      append(
        '読み取り: ' + decodedText
      );


      // 音
      beep();


      try {

        append('保存中...');


        await sendToGas(decodedText);


        append(
          '✓ スプレッドシートに保存しました。',
          'success'
        );


      } catch (error) {

        console.error(error);

        append(
          '✕ 保存に失敗しました: ' +
          error.message,
          'error'
        );

        // 保存失敗した場合は、もう一度読めるようにする
        CURRENT_TEXT = '';

      }

    }


    // ========================================
    // QRコードスキャナー開始
    // ========================================

    const html5QrcodeScanner =
      new Html5QrcodeScanner(
        'reader',
        {
          fps: 10,
          qrbox: 240
        }
      );


    html5QrcodeScanner.render(
      onScanSuccess
    );

    function beep() {

    }


    document
      .querySelector('#sound')
      .addEventListener('click', () => {
        beep();
      });

  </script>
