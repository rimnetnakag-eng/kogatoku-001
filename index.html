<!DOCTYPE html>
<html lang="ja">

<head>

  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width,
               initial-scale=1.0,
               viewport-fit=cover"
  >

  <meta
    name="apple-mobile-web-app-capable"
    content="yes"
  >

  <meta
    name="mobile-web-app-capable"
    content="yes"
  >

  <title>QRコード読み取り</title>


  <!-- ======================================================
       html5-qrcode
       ====================================================== -->

  <script
    src="https://unpkg.com/html5-qrcode">
  </script>


  <style>

    /* ======================================================
       基本
       ====================================================== */

    * {
      box-sizing: border-box;
    }


    html,
    body {

      margin: 0;
      padding: 0;

      width: 100%;
      min-height: 100%;

    }


    body {

      font-family:
        -apple-system,
        BlinkMacSystemFont,
        "Helvetica Neue",
        Arial,
        sans-serif;

      background: #ffffff;

      color: #222222;

      padding:
        20px
        16px
        calc(20px + env(safe-area-inset-bottom));

    }



    /* ======================================================
       タイトル
       ====================================================== */

    h2 {

      margin:
        10px
        0
        20px;

      text-align: center;

      font-size: 24px;

      font-weight: 600;

    }



    /* ======================================================
       QRリーダー
       ====================================================== */

    #reader {

      width:
        min(500px, 100%);

      margin:
        0 auto;

    }


    #reader video {

      width:
        100% !important;

      height:
        auto !important;

      border-radius:
        12px;

    }



    /* ======================================================
       ボタン
       ====================================================== */

    .button-area {

      text-align:
        center;

      margin-top:
        15px;

    }


    button {

      appearance:
        none;

      -webkit-appearance:
        none;

      border:
        1px solid #999;

      border-radius:
        8px;

      background:
        #fff;

      padding:
        12px 20px;

      font-size:
        16px;

      cursor:
        pointer;

      touch-action:
        manipulation;

    }


    button:active {

      background:
        #eeeeee;

    }



    /* ======================================================
       状態表示
       ====================================================== */

    #status {

      width:
        min(500px, 100%);

      margin:
        20px auto 0;

      padding:
        12px;

      border-radius:
        8px;

      text-align:
        center;

      font-size:
        16px;

    }


    .status-normal {

      background:
        #f5f5f5;

      color:
        #555;

    }


    .status-saving {

      background:
        #fff8e1;

      color:
        #8a6d00;

    }


    .status-success {

      background:
        #e8f5e9;

      color:
        #16803c;

    }


    .status-error {

      background:
        #ffebee;

      color:
        #c62828;

    }



    /* ======================================================
       結果表示
       ====================================================== */

    #result {

      width:
        min(500px, 100%);

      margin:
        20px auto 0;

      font-size:
        17px;

      line-height:
        1.6;

      word-break:
        break-word;

    }


    .result-item {

      padding:
        8px 0;

      border-bottom:
        1px solid #eeeeee;

    }


    .success {

      color:
        #16803c;

    }


    .error {

      color:
        #c62828;

    }


    .reading {

      font-weight:
        bold;

    }



    /* ======================================================
       カメラエラー
       ====================================================== */

    #camera-error {

      display:
        none;

      width:
        min(500px, 100%);

      margin:
        20px auto;

      padding:
        15px;

      border-radius:
        8px;

      background:
        #fff3f3;

      color:
        #c62828;

      line-height:
        1.6;

    }

  </style>

</head>



<body>


  <!-- ======================================================
       タイトル
       ====================================================== -->

  <h2>
    どのおかずを食べるかな？
  </h2>



  <!-- ======================================================
       QRカメラ
       ====================================================== -->

  <div id="reader"></div>



  <!-- ======================================================
       カメラエラー
       ====================================================== -->

  <div id="camera-error"></div>



  <!-- ======================================================
       状態
       ====================================================== -->

  <div
    id="status"
    class="status-normal"
  >
    カメラを起動しています...
  </div>



  <!-- ======================================================
       iPhone / iPad用 音声ボタン
       ====================================================== -->

  <div class="button-area">

    <button id="sound">

      🔊 Sound ON
      (iPhone / iPad)

    </button>

  </div>



  <!-- ======================================================
       読み取り結果
       ====================================================== -->

  <div id="result"></div>



  <script>


    // ========================================================
    // ★★★★★★★★★★★★★★★★★★★★★★★★★★★★★★★★★★
    //
    // ★ ここだけ変更してください ★
    //
    // GAS WebアプリのURL
    //
    // 例：
    //
    // https://script.google.com/macros/s/XXXXXXXX/exec
    //
    // ★★★★★★★★★★★★★★★★★★★★★★★★★★★★★★★★★★
    // ========================================================

    const GAS_URL =
      'https://script.google.com/a/macros/gs.seito-fku.ed.jp/s/AKfycbwVX6sD31NkOy5LVPLBEt4tblLdSfDt56gKiCMDRrGZKDKz9TDrn336JjiZ-H2V0N2o/exec';



    // ========================================================
    // 状態
    // ========================================================

    let CURRENT_TEXT = '';

    let IS_SAVING = false;



    // ========================================================
    // 結果表示
    // ========================================================

    function appendResult(
      text,
      className = ''
    ) {

      const div =
        document.createElement(
          'div'
        );


      div.className =
        'result-item ' +
        className;


      div.textContent =
        text;


      document
        .querySelector('#result')
        .appendChild(div);

    }



    // ========================================================
    // ステータス表示
    // ========================================================

    function setStatus(
      text,
      className
    ) {

      const status =
        document.querySelector(
          '#status'
        );


      status.textContent =
        text;


      status.className =
        className;

    }



    // ========================================================
    // カメラエラー
    // ========================================================

    function showCameraError(
      error
    ) {

      const area =
        document.querySelector(
          '#camera-error'
        );


      area.style.display =
        'block';


      let message =
        'カメラを起動できませんでした。';


      if (
        error &&
        error.name ===
          'NotAllowedError'
      ) {

        message =
          'カメラの使用が許可されていません。' +
          '<br><br>' +
          'ブラウザの設定で、このWebサイトのカメラ使用を許可してください。';

      }


      else if (
        error &&
        error.name ===
          'NotFoundError'
      ) {

        message =
          'カメラが見つかりませんでした。';

      }


      else if (
        error &&
        error.name ===
          'NotReadableError'
      ) {

        message =
          'カメラを使用できませんでした。' +
          '<br><br>' +
          '他のアプリがカメラを使用していないか確認してください。';

      }


      area.innerHTML =
        message;

    }



    // ========================================================
    // GASへ保存
    //
    // 重要：
    //
    // iPhone / iPadではCORS制約があるため、
    // fetch()でGASのレスポンスを直接取得しません。
    //
    // HTML form → iframe
    //
    // でPOSTします。
    //
    // ========================================================

    function sendToGas(
      decodedText
    ) {

      return new Promise(
        function(resolve, reject) {


          let finished =
            false;


          // --------------------------------------------------
          // 完了処理
          // --------------------------------------------------

          function finish(
            success,
            message
          ) {

            if (finished) {
              return;
            }


            finished = true;


            if (success) {

              resolve({
                success: true,
                message: message
              });

            }

            else {

              reject(
                new Error(
                  message
                )
              );

            }

          }



          // --------------------------------------------------
          // iframe
          // --------------------------------------------------

          const iframe =
            document.createElement(
              'iframe'
            );


          const iframeName =
            'gas_' +
            Date.now() +
            '_' +
            Math.random()
              .toString(36)
              .substring(2);


          iframe.name =
            iframeName;


          iframe.style.display =
            'none';


          document.body
            .appendChild(
              iframe
            );



          // --------------------------------------------------
          // form
          // --------------------------------------------------

          const form =
            document.createElement(
              'form'
            );


          form.method =
            'POST';


          form.action =
            GAS_URL;


          form.target =
            iframeName;


          form.style.display =
            'none';



          // --------------------------------------------------
          // QRデータ
          // --------------------------------------------------

          const input =
            document.createElement(
              'input'
            );


          input.type =
            'hidden';


          input.name =
            'text';


          input.value =
            decodedText;


          form.appendChild(
            input
          );


          document.body
            .appendChild(
              form
            );



          // --------------------------------------------------
          // 送信
          // --------------------------------------------------

          try {

            form.submit();

          }

          catch (error) {

            try {
              form.remove();
            }
            catch (e) {
            }


            try {
              iframe.remove();
            }
            catch (e) {
            }


            finish(
              false,
              'GASへの送信に失敗しました。'
            );


            return;

          }



          // --------------------------------------------------
          // 注意
          //
          // クロスオリジンiframeなので、
          // GASから返された本文をJavaScriptで
          // 読み取ることはしません。
          //
          // 一定時間後に送信成功と判断します。
          // --------------------------------------------------

          setTimeout(
            function() {


              try {
                form.remove();
              }
              catch (e) {
              }


              try {
                iframe.remove();
              }
              catch (e) {
              }


              finish(
                true,
                'GASへ送信しました。'
              );


            },
            2000
          );



          // --------------------------------------------------
          // 通信タイムアウト
          // --------------------------------------------------

          setTimeout(
            function() {

              if (!finished) {

                try {
                  form.remove();
                }
                catch (e) {
                }


                try {
                  iframe.remove();
                }
                catch (e) {
                }


                finish(
                  false,
                  'GASへの通信がタイムアウトしました。'
                );

              }

            },
            10000
          );

        }
      );

    }



    // ========================================================
    // QR読み取り成功
    // ========================================================

    async function onScanSuccess(
      decodedText,
      decodedResult
    ) {


      console.log(
        'QR:',
        decodedText
      );


      // ------------------------------------------------------
      // 保存中なら無視
      // ------------------------------------------------------

      if (IS_SAVING) {
        return;
      }



      // ------------------------------------------------------
      // 同じQRコードの連続読み取り防止
      // ------------------------------------------------------

      if (
        CURRENT_TEXT ===
        decodedText
      ) {

        return;

      }



      CURRENT_TEXT =
        decodedText;


      IS_SAVING =
        true;



      // ------------------------------------------------------
      // 表示
      // ------------------------------------------------------

      appendResult(
        '読み取り：' +
        decodedText,
        'reading'
      );



      // ------------------------------------------------------
      // 音
      // ------------------------------------------------------

      beep();



      // ------------------------------------------------------
      // 保存中
      // ------------------------------------------------------

      setStatus(
        '保存しています...',
        'status-saving'
      );



      try {


        // ----------------------------------------------------
        // GASへ送信
        // ----------------------------------------------------

        await sendToGas(
          decodedText
        );



        // ----------------------------------------------------
        // 成功
        // ----------------------------------------------------

        setStatus(
          '✓ 保存処理を完了しました',
          'status-success'
        );


        appendResult(
          '✓ GASへ送信しました。',
          'success'
        );


      }


      catch (error) {


        // ----------------------------------------------------
        // 失敗
        // ----------------------------------------------------

        console.error(
          error
        );


        setStatus(
          '✕ 保存に失敗しました',
          'status-error'
        );


        appendResult(
          '✕ 保存に失敗しました：' +
          error.message,
          'error'
        );


        // 再読み取り可能にする
        CURRENT_TEXT =
          '';

      }



      // ------------------------------------------------------
      // 次の読み取り
      // ------------------------------------------------------

      setTimeout(
        function() {

          IS_SAVING =
            false;

          if (
            CURRENT_TEXT ===
            decodedText
          ) {

            setStatus(
              'QRコードを読み取れます',
              'status-normal'
            );

          }

        },
        1200
      );

    }



    // ========================================================
    // QR読み取り中のエラー
    //
    // 読み取りできないフレームがあるだけなので
    // ここでは何もしません。
    // ========================================================

    function onScanFailure(
      error
    ) {

      // 何もしない

    }



    // ========================================================
    // QRスキャナー開始
    // ========================================================

    function startScanner() {


      try {


        const scanner =
          new Html5QrcodeScanner(
            'reader',
            {

              fps: 10,

              qrbox: {
                width: 250,
                height: 250
              },

              rememberLastUsedCamera:
                true,

              showTorchButtonIfSupported:
                true,

              showZoomSliderIfSupported:
                true

            },

            false
          );



        scanner.render(
          onScanSuccess,
          onScanFailure
        );



        setStatus(
          'カメラを起動しています...',
          'status-normal'
        );


      }


      catch (error) {


        console.error(
          'Scanner error:',
          error
        );


        setStatus(
          'カメラを起動できませんでした',
          'status-error'
        );


        showCameraError(
          error
        );

      }

    }



    // ========================================================
    // ビープ音
    // ========================================================

AwNGh0dHA6Ly93d3cuc291bmRib3kuZGUAAAAAAAAAACU=";



    const AUDIO =
      new Audio();


    AUDIO.autoplay =
      true;



    function beep() {

      try {

        AUDIO.src =
          DATA_URL;

      }

      catch (error) {

        console.log(
          'Audio error:',
          error
        );

      }

    }



    // ========================================================
    // iPhone / iPad 音声許可
    // ========================================================

    document
      .querySelector('#sound')
      .addEventListener(
        'click',
        function() {

          beep();


          this.textContent =
            '🔊 Sound ON';

        }
      );



    // ========================================================
    // ページ読み込み
    // ========================================================

    window.addEventListener(
      'load',
      function() {

        startScanner();

      }
    );


  </script>

</body>

</html>
